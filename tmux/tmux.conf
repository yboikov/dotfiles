unbind C-b
unbind r
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
set-option -g status-style bg=default
bind r source-file ~/.config/tmux/tmux.conf
set -g prefix 'C-s'
bind-key 'C-s' send-prefix
# bind -n C-a send-prefix
set -g default-terminal "tmux-256color"

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -r C-h resize-pane -L 5
bind -r C-j resize-pane -D 5
bind -r C-k resize-pane -U 5
bind -r C-l resize-pane -R 5

bind '"' split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind Space last-window
# bind-key -n C-] next-window
# bind-key -n C-[ previous-window

bind-key o popup -d '#{pane_current_path}' -xC -yC -E "tmux list-sessions |grep -vE \"^$(tmux display-message -p '#S')\"| fzf --bind 'enter:become:tmux switch-client -t {1}';"
# bind-key C-h command-prompt -p 'cheat.sh:' \
#   "run-shell 'tmux display-popup -w 90% -h 90% -E \"curl -s https://cheat.sh/\\\$(echo %% | sed \\\"s/ /+/g\\\") | less\"'"

set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'sainnhe/tmux-fzf'
# set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tpm'

set-option -g set-titles on
set-option -g set-titles-string "#T"
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_zoom " "
set -g @catppuccin_window_flags_icon_current " "
set -g @catppuccin_window_flags_icon_last " "
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
# set -g status-left "#{E:@catppuccin_status_session}"
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
# set -agF status-left "#[fg=#{@thm_crust},bg=#{@thm_teal}] ##S █"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
run -b '~/.config/tmux/plugins/tpm/tpm'

